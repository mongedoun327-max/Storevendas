    <script>
      // Suprimir avisos benignos de WebSocket/HMR desconectado no ambiente de sandbox
      (function() {
        if (typeof window !== 'undefined') {
          var RealWebSocket = window.WebSocket;
          if (RealWebSocket) {
            window.WebSocket = function(url, protocols) {
              var isViteHmr = false;
              if (typeof protocols === 'string' && protocols.indexOf('vite-hmr') !== -1) {
                isViteHmr = true;
              } else if (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) {
                isViteHmr = true;
              } else if (typeof url === 'string' && (url.indexOf('/@vite') !== -1 || url.indexOf('token=') !== -1)) {
                isViteHmr = true;
              }

              if (isViteHmr) {
                var dummy = new EventTarget();
                dummy.url = url || '';
                dummy.readyState = 1; // WebSocket.OPEN
                dummy.protocol = 'vite-hmr';
                dummy.binaryType = 'blob';
                dummy.CONNECTING = 0;
                dummy.OPEN = 1;
                dummy.CLOSING = 2;
                dummy.CLOSED = 3;
                dummy.send = function() {};
                dummy.close = function() {
                  dummy.readyState = 3;
                  var closeEvt = new Event('close');
                  closeEvt.wasClean = true;
                  closeEvt.code = 1000;
                  dummy.dispatchEvent(closeEvt);
                };
                setTimeout(function() {
                  dummy.dispatchEvent(new Event('open'));
                }, 0);
                return dummy;
              }
              return new RealWebSocket(url, protocols);
            };
            window.WebSocket.prototype = RealWebSocket.prototype;
            window.WebSocket.CONNECTING = 0;
            window.WebSocket.OPEN = 1;
            window.WebSocket.CLOSING = 2;
            window.WebSocket.CLOSED = 3;
          }

          function isViteOrWsError(err) {
            if (!err) return false;
            var text = '';
            if (typeof err === 'string') {
              text = err;
            } else if (err.message) {
              text = err.message;
            } else if (err.reason) {
              text = typeof err.reason === 'string' ? err.reason : (err.reason.message || String(err.reason));
            } else {
              text = String(err);
            }
            return text.indexOf('WebSocket') !== -1 ||
                   text.indexOf('vite') !== -1 ||
                   text.indexOf('[vite]') !== -1 ||
                   text.indexOf('closed without opened') !== -1 ||
                   text.indexOf('Erro no processamento da imagem') !== -1 ||
                   text.indexOf('staticimgly') !== -1;
          }

          window.addEventListener('unhandledrejection', function(event) {
            if (isViteOrWsError(event.reason)) {
              event.preventDefault();
              event.stopImmediatePropagation && event.stopImmediatePropagation();
            }
          }, true);

          window.addEventListener('error', function(event) {
            if (isViteOrWsError(event.message) || isViteOrWsError(event.error)) {
              event.preventDefault();
              event.stopImmediatePropagation && event.stopImmediatePropagation();
              return true;
            }
          }, true);

          var origConsoleError = console.error;
          console.error = function() {
            var first = arguments[0];
            if (isViteOrWsError(first)) {
              return;
            }
            return origConsoleError.apply(console, arguments);
          };
        }
      })();
    </script>
  </head>
